<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<title>Мои тренировки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #121214; --card: #1c1c20; --card2: #24242a; --line: #2e2e35;
    --text: #f2f2f4; --muted: #9a9aa5; --accent: #4ade80; --accent-ink: #062b14;
    --warn: #fbbf24; --danger: #f87171; --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  h2 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
  .day-card { display: block; width: 100%; text-align: left; }
  .day-card.today { border-color: var(--accent); }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--card2); color: var(--muted); margin-left: 6px; vertical-align: middle; }
  .badge.green { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .ex-line { padding: 10px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .ex-line:first-of-type { border-top: 0; }
  .ex-line .done { color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 12px; background: var(--card2); font-weight: 600; min-height: 48px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }
  .btn.small { padding: 8px 12px; min-height: 36px; font-size: 14px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .4; }
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .topbar .title { flex: 1; min-width: 0; }
  .topbar .title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--card2); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .dots { display: flex; gap: 4px; margin: 4px 0 12px; }
  .dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .dots i.cur { background: var(--text); }
  .gif { background: #fff; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; aspect-ratio: 4/3; overflow: hidden; }
  .gif img { height: 100%; width: auto; max-width: 100%; object-fit: contain; image-rendering: auto; }
  .muscles { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; margin: 10px 0; scrollbar-width: none; }
  .chip { flex: none; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .last { font-size: 14px; color: var(--muted); background: var(--card2); border-radius: 10px; padding: 8px 12px; margin: 8px 0; }
  table.sets { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  table.sets th { font-size: 12px; color: var(--muted); font-weight: 500; text-align: center; }
  table.sets td { text-align: center; }
  table.sets td:first-child { color: var(--muted); width: 32px; }
  .num { width: 100%; max-width: 110px; text-align: center; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); font-size: 18px; font-weight: 600; }
  .num:focus { outline: 2px solid var(--accent); border-color: transparent; }
  tr.done .num { border-color: transparent; background: #183323; }
  .check { width: 48px; height: 48px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-size: 22px; }
  tr.done .check { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tips h3 { font-size: 15px; margin: 14px 0 6px; }
  .tips ul { margin: 0; padding-left: 20px; }
  .tips li { margin: 6px 0; color: #d7d7dc; }
  .tips .bad li::marker { color: var(--danger); }
  .tips .good li::marker { color: var(--accent); }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(transparent, var(--bg) 30%); padding: 20px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bottom .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .bottom .inner .btn { flex: 1; }
  .bottom .inner .btn[data-act="prev"] { flex: 0 0 56px; }
  .rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px #0008; }
  .rest .inner { max-width: 560px; margin: 0 auto; text-align: center; }
  .rest .time { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .rest .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 14px; }
  .rest .bar i { display: block; height: 100%; background: var(--accent); }
  .rest.over { background: #183323; }
  .rest .btns { display: flex; gap: 10px; }
  .rest .btns .btn { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .field label { font-size: 12px; color: var(--muted); }
  .field .num { max-width: none; }
  .grid3 { display: flex; gap: 10px; }
  .big-timer { font-size: 48px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 8px 0; }
  .muted { color: var(--muted); }
  .hist-item summary { list-style: none; cursor: pointer; }
  .hist-item summary::-webkit-details-marker { display: none; }
  .hist-ex { font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
  .stat { display: flex; gap: 10px; margin: 12px 0; }
  .stat div { flex: 1; background: var(--card2); border-radius: 12px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .footer-links { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 20; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
